version: "3.8"

services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"
      - "8081:8080" # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  cp-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cp-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.cp-ui.priority=1"
      - "traefik.http.routers.cp-ui.entrypoints=web"
      - "traefik.http.services.cp-ui.loadbalancer.server.port=80"
    restart: unless-stopped

  cp-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cp-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.cp-api.priority=10"
      - "traefik.http.routers.cp-api.entrypoints=web"
      - "traefik.http.services.cp-api.loadbalancer.server.port=3000"
    volumes:
      - /root/artifacts:/artifacts:rw
      - /root/wednes-engine:/wednes-engine:ro
    environment:
      - DATABASE_URL=postgres://wednes:secret@db:5432/wednes_cp
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=wednes
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=wednes_cp
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
